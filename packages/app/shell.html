<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="white" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#222222" />
    <!-- Apply the stored color scheme before first paint, so dark mode doesn't flash white. -->
    <script>
      try {
        const s = localStorage.getItem('vueuse-color-scheme')
        document.documentElement.classList.toggle(
          'dark',
          s === 'dark' || (s !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches),
        )
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>pulls.review</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/local/shell/main.ts"></script>
  </body>
</html>
